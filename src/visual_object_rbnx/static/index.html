<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robonix 纯视觉方块识别与箱子交互控制台 (8094)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    h1 { margin: 0 0 12px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #0ea5e933; color: var(--accent); border: 1px solid #38bdf855; }
    .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; align-items: start; }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    .preview-wrap { position: relative; background: #020617; border-radius: 8px; overflow: hidden; min-height: 280px; display: flex; align-items: center; justify-content: center; }
    .preview-wrap img { width: 100%; height: auto; display: block; }
    .muted { color: var(--muted); font-size: 12px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    button {
      background: #334155; color: var(--text); border: 1px solid #475569; border-radius: 8px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
    }
    button:hover { filter: brightness(1.12); }
    button.primary { background: #0284c7; border-color: #38bdf8; }
    button.ok { background: #15803d; border-color: #22c55e; }
    button.danger { background: #991b1b; border-color: #ef4444; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    input, select {
      background: #0f172a; color: var(--text); border: 1px solid var(--border);
      border-radius: 7px; padding: 6px 9px; font-size: 13px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #33415588; }
    th { color: var(--muted); font-weight: 600; }
    tr.selected { background: #0284c733; }
    .toast {
      margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: 12.5px;
      background: #0f172a; border: 1px solid var(--border); min-height: 34px; white-space: pre-wrap;
    }
    .toast.ok { border-color: var(--ok); color: #bbf7d0; }
    .toast.err { border-color: var(--danger); color: #fecaca; }
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .pill { background: #0f172a; border: 1px solid var(--border); padding: 3px 8px; border-radius: 999px; }
  </style>
</head>
<body>
  <h1>
    📦 纯传感器 RGB-D 方块识别与箱子交互控制台
    <span class="badge" id="backendBadge">检测器: 加载中...</span>
  </h1>
  <div class="pill-row">
    <span class="pill" id="odomPill">Odom: --</span>
    <span class="pill" id="framePill">RGB-D 帧: 0</span>
    <span class="pill" id="busyPill">状态: 空闲</span>
    <button id="btnToggleDetect" class="ok" type="button" style="padding:3px 10px;font-size:12px;">🟢 视觉识别: 已开启</button>
    <span id="labelToggles" style="display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;"></span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>
        <span>实时相机 RGB-D 检测画面</span>
        <span class="muted">绿框 = 通过 3D 尺寸校验 · 黄框 = 2D 候选</span>
      </h2>
      <div class="preview-wrap">
        <img id="previewImg" alt="等待机器人 RGB 图像流..." />
      </div>
      <div class="row" style="margin-top:10px;">
        <select id="scanLabel">
          <option value="chest">箱子 (chest)</option>
        </select>
        <label class="muted"><input id="chkSweep" type="checkbox" checked /> 360° 环顾扫视</label>
        <button id="btnScan" class="primary" type="button">🔍 扫描方块</button>
        <button id="btnClear" class="danger" type="button">清空记录</button>
      </div>
      <div id="toast" class="toast">就绪：点击「扫描方块」发现当前房间内的箱子，随后可一键检查、取出或放入物品。</div>
    </div>

    <div class="card">
      <h2>
        <span>已确认的 3D 目标列表</span>
        <span class="muted" id="objCount">0 个目标</span>
      </h2>
      <table>
        <thead>
          <tr><th>ID</th><th>类别</th><th>距离</th><th>尺寸(m)</th><th>置信度</th><th>操作</th></tr>
        </thead>
        <tbody id="objTableBody">
          <tr><td colspan="6" class="muted">暂无已确认目标</td></tr>
        </tbody>
      </table>

      <h2 style="margin-top:16px;">箱子交互操作（选中目标：<span id="selIdLabel">自动选最近</span>）</h2>
      <div class="row">
        <button id="btnApproach" type="button">🚶 走近箱子</button>
        <button id="btnInspect" class="primary" type="button">🔓 开箱检查物品</button>
      </div>
      <div class="row">
        <input id="itemInput" type="text" value="minecraft:bread" placeholder="物品ID (如 minecraft:bread)" style="flex:1" />
        <input id="countInput" type="number" value="1" min="1" max="64" style="width:72px" />
        <button id="btnWithdraw" class="ok" type="button">⬇ 取出</button>
        <button id="btnDeposit" class="primary" type="button">⬆ 放入</button>
      </div>

      <h2 style="margin-top:14px;">最近一次开箱物品清单</h2>
      <table>
        <thead>
          <tr><th>槽位</th><th>物品 ID</th><th>数量</th></tr>
        </thead>
        <tbody id="chestItemsBody">
          <tr><td colspan="3" class="muted">点击「开箱检查物品」查看</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let selectedId = '';
    const toastEl = document.getElementById('toast');
    function showToast(ok, msg) {
      toastEl.className = 'toast ' + (ok ? 'ok' : 'err');
      toastEl.textContent = msg;
    }

    async function postJson(url, body) {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      });
      const d = await r.json();
      return { ok: r.ok && Boolean(d.ok), data: d };
    }

    function renderChestItems(items) {
      const tb = document.getElementById('chestItemsBody');
      const nonEmpty = (items || []).filter(it => it.count > 0 && it.item !== 'minecraft:air');
      if (!nonEmpty.length) {
        tb.innerHTML = '<tr><td colspan="3" class="muted">箱子为空</td></tr>';
        return;
      }
      tb.innerHTML = nonEmpty.map(it =>
        `<tr><td>#${it.slot}</td><td>${it.item}</td><td><strong>${it.count}</strong></td></tr>`
      ).join('');
    }

    async function pollState() {
      try {
        const r = await fetch('/api/state');
        const d = await r.json();
        const det = d.detector || {};
        document.getElementById('backendBadge').textContent =
          det.onnx_enabled ? '检测器: ONNX + Classic' : `检测器: Classic (${(det.classic_labels || []).join(',')})`;
        const odom = d.odom;
        document.getElementById('odomPill').textContent = odom
          ? `Odom: (${odom.x.toFixed(2)}, ${odom.y.toFixed(2)}, z=${odom.z.toFixed(2)})`
          : 'Odom: 等待中';
        document.getElementById('framePill').textContent =
          `RGB-D 帧: ${d.frames_processed || 0} · 当前2D: ${d.last_2d_count || 0} · 3D: ${d.last_3d_count || 0}`;
        document.getElementById('busyPill').textContent = d.busy ? `执行中: ${d.busy_detail || '...'}` : '状态: 空闲';

        // Master switch & per-label checkboxes
        const detOn = d.detection_enabled !== false;
        const enabledSet = new Set(d.enabled_labels || []);
        const btnTog = document.getElementById('btnToggleDetect');
        btnTog.dataset.enabled = detOn ? '1' : '0';
        btnTog.textContent = detOn ? '🟢 视觉识别: 已开启' : '⏸ 视觉识别: 已关闭';
        btnTog.className = detOn ? 'ok' : 'danger';

        // Populate label dropdown & per-class toggle checkboxes
        const sel = document.getElementById('scanLabel');
        const specs = d.specs || [];
        if (specs.length && sel.options.length !== specs.length) {
          const prev = sel.value;
          sel.innerHTML = specs.map(s => `<option value="${s.label}">${s.display_name} (${s.label})</option>`).join('');
          if (prev) sel.value = prev;
        }
        const ltWrap = document.getElementById('labelToggles');
        const ltKey = `${detOn}|` + specs.map(s => `${s.label}:${enabledSet.has(s.label) ? 1 : 0}`).join(',');
        if (ltWrap && ltWrap.dataset.key !== ltKey) {
          ltWrap.dataset.key = ltKey;
          ltWrap.innerHTML = specs.map(s => {
            const chk = enabledSet.has(s.label) ? 'checked' : '';
            return `<label class="pill" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;">` +
              `<input type="checkbox" ${chk} onchange="toggleLabel('${s.label}', this.checked)" />${s.display_name}(${s.label})</label>`;
          }).join('');
        }

        const objs = d.objects || [];
        document.getElementById('objCount').textContent = `${objs.length} 个已确认`;
        const tb = document.getElementById('objTableBody');
        if (!objs.length) {
          tb.innerHTML = '<tr><td colspan="6" class="muted">暂无已确认目标（点击左侧「扫描方块」）</td></tr>';
        } else {
          tb.innerHTML = objs.map(o => `
            <tr class="${o.visual_id === selectedId ? 'selected' : ''}" onclick="selectObj('${o.visual_id}')">
              <td><strong>${o.visual_id}</strong></td>
              <td>${o.label}</td>
              <td>${Number(o.distance_m).toFixed(2)}m</td>
              <td>${Number(o.width_m).toFixed(2)}×${Number(o.height_m).toFixed(2)}</td>
              <td>${Math.round(o.confidence * 100)}% (${o.hits}帧)</td>
              <td><button type="button" onclick="event.stopPropagation(); quickInspect('${o.visual_id}')">开箱</button></td>
            </tr>`).join('');
        }
        if (d.last_inspect && d.last_inspect.items) {
          renderChestItems(d.last_inspect.items);
        }
      } catch (e) {}
    }

    window.selectObj = (id) => {
      selectedId = id;
      document.getElementById('selIdLabel').textContent = id || '自动选最近';
      pollState();
    };
    window.quickInspect = async (id) => {
      selectObj(id);
      showToast(true, `正在走近并打开 ${id}...`);
      const res = await postJson('/api/inspect', { visual_id: id });
      showToast(res.ok, res.data.detail || JSON.stringify(res.data));
      if (res.data.items) renderChestItems(res.data.items);
      pollState();
    };

    window.toggleLabel = async (label, enabled) => {
      const res = await postJson('/api/toggle', { label, enabled });
      showToast(res.ok, res.data.detail || '已更新类别开关');
      pollState();
    };
    document.getElementById('btnToggleDetect').addEventListener('click', async () => {
      const cur = document.getElementById('btnToggleDetect').dataset.enabled === '1';
      const res = await postJson('/api/toggle', { detection_enabled: !cur });
      showToast(res.ok, res.data.detail || '已切换视觉识别开关');
      pollState();
    });

    document.getElementById('btnScan').addEventListener('click', async () => {
      const label = document.getElementById('scanLabel').value || 'chest';
      const sweep = document.getElementById('chkSweep').checked;
      showToast(true, `正在扫描 ${label} (sweep=${sweep})...`);
      const res = await postJson('/api/scan', { label, sweep, max_distance_m: 10.0 });
      showToast(res.ok, res.data.detail || `扫描完成，发现 ${res.data.count || 0} 个目标`);
      pollState();
    });
    document.getElementById('btnClear').addEventListener('click', async () => {
      selectedId = '';
      document.getElementById('selIdLabel').textContent = '自动选最近';
      const res = await postJson('/api/clear', {});
      showToast(res.ok, res.data.detail || '已清空');
      pollState();
    });
    document.getElementById('btnApproach').addEventListener('click', async () => {
      showToast(true, `正在走近 ${selectedId || '最近箱子'}...`);
      const res = await postJson('/api/approach', { visual_id: selectedId, label: 'chest' });
      showToast(res.ok, res.data.detail || '已到达');
      pollState();
    });
    document.getElementById('btnInspect').addEventListener('click', async () => {
      showToast(true, `正在走近并检查 ${selectedId || '最近箱子'}...`);
      const res = await postJson('/api/inspect', { visual_id: selectedId });
      showToast(res.ok, res.data.detail || '检查完成');
      if (res.data.items) renderChestItems(res.data.items);
      pollState();
    });
    document.getElementById('btnWithdraw').addEventListener('click', async () => {
      const item = document.getElementById('itemInput').value.trim();
      const count = Number(document.getElementById('countInput').value || 1);
      showToast(true, `正在从 ${selectedId || '最近箱子'} 取出 ${count} × ${item}...`);
      const res = await postJson('/api/withdraw', { visual_id: selectedId, item, count });
      showToast(res.ok, res.data.detail || '取出完成');
      pollState();
    });
    document.getElementById('btnDeposit').addEventListener('click', async () => {
      const item = document.getElementById('itemInput').value.trim();
      const count = Number(document.getElementById('countInput').value || 1);
      showToast(true, `正在向 ${selectedId || '最近箱子'} 放入 ${count} × ${item}...`);
      const res = await postJson('/api/deposit', { visual_id: selectedId, item, count });
      showToast(res.ok, res.data.detail || '放入完成');
      pollState();
    });

    function refreshPreview() {
      const img = document.getElementById('previewImg');
      img.src = '/api/preview.jpg?t=' + Date.now();
    }
    pollState();
    refreshPreview();
    setInterval(pollState, 800);
    setInterval(refreshPreview, 450);
  </script>
</body>
</html>
